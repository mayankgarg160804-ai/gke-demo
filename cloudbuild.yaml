steps:
  # Step 1: Build image
  - name: gcr.io/cloud-builders/docker
    args:
      [
        "build",
        "-t",
        "${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:${SHORT_SHA}",
        "."
      ]

  # Step 2: Push image to Artifact Registry
  - name: gcr.io/cloud-builders/docker
    args:
      [
        "push",
        "${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:${SHORT_SHA}"
      ]

  # Step 3: Invoke deploy trigger on success
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      [
        "builds",
        "triggers",
        "run",
        "${_DEPLOY_TRIGGER_NAME}",
        "--region=${_LOCATION}",
        "--substitutions=_IMAGE_TAG=${SHORT_SHA}"
      ]

substitutions:
  _LOCATION: us-central1
  _REPOSITORY: gke-demo-repo
  _IMAGE: demo-app
  _DEPLOY_TRIGGER_NAME: deploy-trigger

options:
  logging: CLOUD_LOGGING_ONLY